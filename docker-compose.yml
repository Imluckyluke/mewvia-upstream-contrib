name: mewvia

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: mewvia-bot:latest
    restart: unless-stopped
    init: true          # PID-1 zombie reaping for ffmpeg subprocesses
    group_add:
      - "101"           # Access files downloaded by local telegram-bot-api (GID 101)
    env_file: .env
    environment:
      # Service wiring (overrides .env so compose stays the source of truth for hosts)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      TMP_DIR: /data/tmp
      BACKUP_DIR: /data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bgutil-provider:
        condition: service_started
      warp:
        condition: service_started
    volumes:
      - mewvia_data:/data
      - mewvia_botapi:/var/lib/telegram-bot-api
      - /usr/local/bin/deno:/usr/local/bin/deno:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys,time; p=pathlib.Path('/data/health'); sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime < 90 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mewvia}
      POSTGRES_USER: ${POSTGRES_USER:-mewvia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - mewvia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mewvia} -d ${POSTGRES_DB:-mewvia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - mewvia_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Local Bot API Server.
  # The public Bot API caps downloads at 20MB and uploads at 50MB. Running this
  # service lifts both to ~2GB.
  # ---------------------------------------------------------------------------
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - mewvia_botapi:/var/lib/telegram-bot-api
      - mewvia_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Cloudflare WARP Outbound Proxy
  # Bypasses datacenter IP blocks and YouTube/Instagram login walls.
  # ---------------------------------------------------------------------------
  warp:
    build: ./warp
    image: mewvia-warp:latest
    container_name: mewvia-warp
    restart: unless-stopped
    privileged: true
    expose:
      - "1080"
      - "4416"
    volumes:
      - mewvia_warpdata:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # YouTube PO Token Provider (Proof of Origin)
  # Runs inside WARP network namespace so PO-tokens match the outbound IP.
  # ---------------------------------------------------------------------------
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    network_mode: "service:warp"
    depends_on:
      warp:
        condition: service_healthy

volumes:
  mewvia_data:
  mewvia_pgdata:
  mewvia_redisdata:
  mewvia_botapi:
  mewvia_warpdata:
