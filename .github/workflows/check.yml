name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mewvia
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mewvia
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      BOT_TOKEN: '1:test'
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check . && mypy app
      - run: alembic upgrade head && python -m app.db.seed
      - run: pytest -p no:cacheprovider
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t audit-runtime .
      - run: docker run --rm audit-runtime sh -ec 'deno --version; ffmpeg -version; age --version; python -c "import PIL, app.bot; assert PIL.__version__ == \"13.0.0\""'
      - name: Worker startup and Unix socket transport
        run: |
          set -eu
          docker network create audit-egress
          docker run -d --name warp --network audit-egress audit-runtime sleep 300
          docker volume create audit-ipc
          docker run -d --name media-worker --network audit-egress --user root --cap-add NET_ADMIN -e BOT_TOKEN=1:test -v audit-ipc:/run/mewvia audit-runtime sh /app/app/media/egress.sh
          docker exec media-worker sh -ec 'for i in $(seq 1 20); do test ! -S /run/mewvia/media.sock || exit 0; sleep 1; done; exit 1' || { docker logs media-worker; exit 1; }
          docker run --rm --network none -v audit-ipc:/run/mewvia:ro audit-runtime python -c 'import json,socket; s=socket.socket(socket.AF_UNIX); s.settimeout(5); s.connect("/run/mewvia/media.sock"); s.sendall(b"[\"unknown\",[]]\n"); assert "error" in json.loads(s.makefile().readline())'
      - name: Scan runtime packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: audit-runtime
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
