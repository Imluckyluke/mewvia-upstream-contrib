name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mewvia
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mewvia
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      BOT_TOKEN: '1:test'
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check . && mypy app
      - run: alembic upgrade head && python -m app.db.seed
      - run: pytest -p no:cacheprovider
